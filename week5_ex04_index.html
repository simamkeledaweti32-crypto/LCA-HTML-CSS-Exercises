<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - Bootstrap Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="week3_ex04_index.html">My Store</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link active" href="week3_ex04_index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="week3_ex04_products.html">Products</a></li>
          <li class="nav-item"><a class="nav-link" href="week3_ex04_contact.html">Contact</a></li>
          <li class="nav-item"><a class="nav-link" href="week3_ex04_about.html">About</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div id="storeCarousel" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="https://via.placeholder.com/1200x400/007bff/ffffff?text=Welcome+to+Our+Store" class="d-block w-100" alt="Slide 1">
      </div>
      <div class="carousel-item">
        <img src="https://via.placeholder.com/1200x400/28a745/ffffff?text=Quality+Products" class="d-block w-100" alt="Slide 2">
      </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#storeCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#storeCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>
  </div>

  <div class="container mt-4">
    <div class="alert alert-success" role="alert" data-aos="fade-up">
      20% OFF on all products this week! Shop now!
    </div>
  </div>

  <div class="container my-5">
    <div class="row">
      <div class="col-md-4 mb-3" data-aos="zoom-in">
        <div class="card">
          <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Product">
          <div class="card-body">
            <h5 class="card-title">Featured Product</h5>
            <p class="card-text">Best selling item this month.</p>
            <a href="week3_ex04_products.html" class="btn btn-primary">View Products</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="bg-dark text-white text-center py-3 mt-5">
    <p class="mb-0">© 2026 My Store. All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>AOS.init();</script>
</body>
</html>
