<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Showcase</title>
  <link rel="stylesheet" href="week5_ex01_style.css">
</head>
<body>
  <header>
    <h1>Product Showcase</h1>
  </header>

  <main class="products-grid">
    <div class="product-card">
      <img src="https://via.placeholder.com/300x200" alt="Product 1">
      <h2>Wireless Headphones</h2>
      <p>R999.99</p>
      <button class="add-to-cart">Add to Cart</button>
    </div>

    <div class="product-card">
      <img src="https://via.placeholder.com/300x200" alt="Product 2">
      <h2>Smart Watch</h2>
      <p>R1,499.99</p>
      <button class="add-to-cart">Add to Cart</button>
    </div>

    <div class="product-card">
      <img src="https://via.placeholder.com/300x200" alt="Product 3">
      <h2>Bluetooth Speaker</h2>
      <p>R599.99</p>
      <button class="add-to-cart">Add to Cart</button>
    </div>

    <div class="product-card">
      <img src="https://via.placeholder.com/300x200" alt="Product 4">
      <h2>Gaming Mouse</h2>
      <p>R349.99</p>
      <button class="add-to-cart">Add to Cart</button>
    </div>

    <div class="product-card">
      <img src="https://via.placeholder.com/300x200" alt="Product 5">
      <h2>Mechanical Keyboard</h2>
      <p>R1,299.99</p>
      <button class="add-to-cart">Add to Cart</button>
    </div>

    <div class="product-card">
      <img src="https://via.placeholder.com/300x200" alt="Product 6">
      <h2>4K Monitor</h2>
      <p>R3,999.99</p>
      <button class="add-to-cart">Add to Cart</button>
    </div>
  </main>
</body>
</html>
