<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Bootstrap Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="week3_ex04_index.html">My Store</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="week3_ex04_index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="week3_ex04_products.html">Products</a></li>
          <li class="nav-item"><a class="nav-link active" href="week3_ex04_contact.html">Contact</a></li>
          <li class="nav-item"><a class="nav-link" href="week3_ex04_about.html">About</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8" data-aos="fade-up">
        <h2 class="text-center mb-4">Contact Us</h2>
        <div class="alert alert-info" role="alert">We'd love to hear from you!</div>
        <form>
          <div class="mb-3"><label class="form-label">Name</label><input type="text" class="form-control" placeholder="Your Name"></div>
          <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" placeholder="your@email.com"></div>
          <div class="mb-3"><label class="form-label">Message</label><textarea class="form-control" rows="5" placeholder="Your message..."></textarea></div>
          <button type="submit" class="btn btn-primary" disabled>Send Message</button>
        </form>
      </div>
    </div>
  </div>

  <footer class="bg-dark text-white text-center py-3 mt-5">
    <p class="mb-0">© 2026 My Store. All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>AOS.init();</script>
